networks:
  microservices-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-yers
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yers7
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yers7
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-yers
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-yers:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-yers:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNCtjWNTJcWNTJ2Qk
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - microservices-net

  akhq:
    image: tchiotludo/akhq:latest
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
            connections:
              local-kafka:
                properties:
                  bootstrap.servers: "kafka-yers:9092"
    ports:
      - "8089:8080"
    depends_on:
      - kafka
    networks:
      - microservices-net


  auth-service:
    build: 
      context: ./auth-service
    container_name: auth-service-yers
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=yers7
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-yers:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - microservices-net

  product-service:
    build: 
      context: ./product-service
    container_name: product-service-yers
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=yers7
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-yers:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-net

  sales-service:
    build: 
      context: ./sales-service
    container_name: sales-service-yers
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sales_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=yers7
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-yers:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - microservices-net

volumes:
  postgres_data: